[package]
name = "notecraft"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
eframe = "0.37"
egui_commonmark = { version = "0.26.0", features = ["svg"] }
egui_extras = { version = "0.37", features = ["all_loaders"] }
image = "0.25.10"
open = "5.4.5"
pulldown-cmark = "0.13.6"
regex = "1.13.1"
rfd = "0.17.2"
wry = "0.57.1"

[target.'cfg(windows)'.dependencies]
# Same versions as wry uses, for the page view's picture in --screenshot.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[build-dependencies]
winresource = "0.1.34"

# Small, fast program for copying to other computers (cargo build --release).
[profile.release]
opt-level = 3
lto = "thin"
strip = true
